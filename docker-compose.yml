version: '3.8'

services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: traffic_postgres
    restart: always
    environment:
      POSTGRES_USER: traffic_user
      POSTGRES_PASSWORD: traffic_password
      POSTGRES_DB: traffic_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic_user -d traffic_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # FastAPI + AI Processing Backend
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: traffic_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://traffic_user:traffic_password@postgres:5432/traffic_db
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - YOLO_MODEL=yolov8n.pt
      - DEFAULT_SPEED_LIMIT=60.0
    ports:
      - "8000:8000"
    volumes:
      - ./evidence:/app/evidence
      - ./videos:/app/videos
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # React Dashboard Frontend
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: traffic_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
